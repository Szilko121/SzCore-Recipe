# =============================================================================
#  SzCore Framework v1.4.0-rc1
#  Official txAdmin / FXServer configuration
# =============================================================================
#
# FiveM server commands:
# https://docs.fivem.net/docs/server-manual/server-commands/
#
# IMPORTANT:
# - Values wrapped in {{...}} are filled automatically by txAdmin Recipe Deployer.
# - Do NOT commit a real Cfx.re license key, database password, RCON password,
#   Discord webhook, Steam API key or Tebex secret to a public repository.
# =============================================================================


# -----------------------------------------------------------------------------
# NETWORK / TXADMIN REQUIRED PLACEHOLDERS
# -----------------------------------------------------------------------------

# txAdmin generates the endpoint_add_tcp / endpoint_add_udp lines.
{{serverEndpoints}}

# txAdmin-selected slot count.
sv_maxclients {{maxClients}}

# Cfx.re server registration key from https://portal.cfx.re/
# txAdmin automatically replaces this placeholder during deployment.
sv_licenseKey "{{svLicense}}"


# -----------------------------------------------------------------------------
# SERVER IDENTITY / SERVER BROWSER
# -----------------------------------------------------------------------------

sv_hostname "{{serverName}} | SzCore Framework"

sets sv_projectName "{{serverName}}"
sets sv_projectDesc "Powered by SzCore Framework v1.4.0-rc1 — modular, server-authoritative FiveM roleplay framework."

# Comma-separated server browser tags.
sets tags "roleplay, rp, szcore, szcode, framework, custom, hungarian"

# Primary server language / locale.
sets locale "hu-HU"

# Browser metadata.
gametype "Roleplay"
mapname "Los Santos"

# Keep the server public.
sv_lan false

# Hides player IP addresses from public server-report endpoints.
sv_endpointPrivacy true

# Do NOT uncomment this unless you intentionally want the server browser
# connect button to behave as private.
# sv_master1 ""

# Optional browser / connecting banners.
# sets banner_detail "https://example.com/banner.png"
# sets banner_connecting "https://example.com/banner.png"

# Optional 96x96 PNG server icon.
# Add the image to the server-data root before enabling this.
# load_server_icon "szcore.png"


# -----------------------------------------------------------------------------
# GTA / ONESYNC
# -----------------------------------------------------------------------------

# Explicit FiveM / GTA V mode.
gamename gta5

# Current FiveM documented game build:
# 3751 = A Safehouse in the Hills.
sv_enforceGameBuild 3751

# Full state awareness. Required for SzCore state bags, routing buckets
# and server-authoritative entity logic.
set onesync on

# Explicit current OneSync defaults.
set onesync_enableInfinity true
set onesync_population true
set onesync_forceMigration true
set onesync_distanceCulling true
set onesync_distanceCullVehicles false
set onesync_radiusFrequency true
set sv_useAccurateSends true


# -----------------------------------------------------------------------------
# BASE FXSERVER SECURITY / NETWORKING
# -----------------------------------------------------------------------------

# ScriptHook V client plugins are not allowed.
sv_scriptHookAllowed 0

# Net-event reassembly defaults, kept explicit for predictable deployments.
set sv_enableNetEventReassembly true
set sv_netEventReassemblyMaxPendingEvents 100
set sv_netEventReassemblyUnlimitedPendingEvents false

# REQUEST_PHONE_EXPLOSION_EVENT is disabled by default by FXServer.
# Keep it explicitly disabled.
set sv_enableNetworkedPhoneExplosions false

# SzCore currently expects normal network-owner state-bag behavior.
# Do not enable strict mode without testing every gameplay resource.
setr sv_stateBagStrictMode false

# Keep entity lockdown compatible with normal FiveM client-created entities.
set sv_entityLockdown inactive

# Default TCP idle timeout.
sv_tcpConnectionTimeoutSeconds 5

# System chat is used by the stock chat resource.
set resources_useSystemChat true

# Steam identifiers are OPTIONAL.
# Replace "none" with a real Steam Web API key only if your server requires
# Steam identifiers.
set steam_webApiKey "none"

# RCON is disabled when no password is configured.
# If you enable it, use a long unique secret and NEVER commit the real value.
# set rcon_password "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"

# Optional Tebex secret. Do not commit a real secret publicly.
# set sv_tebexSecret "CHANGE_ME"


# -----------------------------------------------------------------------------
# OPTIONAL HARDENING
# -----------------------------------------------------------------------------
# These settings can improve security but may break resources, custom assets,
# vehicle control flows or client-side state bags. Enable them only after
# staging tests.
#
# sv_pureLevel 1
# set sv_requestParanoia 1
# set sv_filterRequestControl 1
# set sv_filterRequestControlSettleTimer 30000
#
# Do NOT blindly disable networked sounds or script entity states:
# some resources depend on them.
# set sv_enableNetworkedSounds false
# set sv_enableNetworkedScriptEntityStates false


# -----------------------------------------------------------------------------
# DATABASE / OXMYSQL
# -----------------------------------------------------------------------------

# txAdmin generates this value from the database step in recipe.yaml.
set mysql_connection_string "{{dbConnectionString}}"


# -----------------------------------------------------------------------------
# SZCORE CONVARS
# -----------------------------------------------------------------------------

# Built-in connection queue.
set szcore_queue_enabled 1

# Number of slots reserved for players with ACE "szcore.priority".
set szcore_reserved_slots 0

# Optional Discord webhook for SzCore WARN/ERROR logs.
# Keep empty by default. Never commit a real webhook publicly.
set szcore_log_webhook ""


# -----------------------------------------------------------------------------
# CFX DEFAULT RESOURCES
# -----------------------------------------------------------------------------

ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure baseevents
ensure rconlog


# -----------------------------------------------------------------------------
# DATABASE DEPENDENCY
# -----------------------------------------------------------------------------

ensure oxmysql


# -----------------------------------------------------------------------------
# SZCORE CORE / FOUNDATION
# -----------------------------------------------------------------------------

ensure szcore
ensure szcore_world
ensure szcore_queue
ensure szcore_ui
ensure szcore_interact


# -----------------------------------------------------------------------------
# CHARACTER
# -----------------------------------------------------------------------------

ensure szcore_multichar
ensure szcore_spawn
ensure szcore_appearance


# -----------------------------------------------------------------------------
# INVENTORY / ECONOMY / ORGANIZATIONS
# -----------------------------------------------------------------------------

ensure szcore_inventory
ensure szcore_society
ensure szcore_banking
ensure szcore_billing
ensure szcore_paycheck


# -----------------------------------------------------------------------------
# VEHICLES
# -----------------------------------------------------------------------------

ensure szcore_vehicles
ensure szcore_vehiclekeys
ensure szcore_garage
ensure szcore_vehiclefailure


# -----------------------------------------------------------------------------
# PLAYER STATUS / MEDICAL / GAMEPLAY
# -----------------------------------------------------------------------------

ensure szcore_status
ensure szcore_death
ensure szcore_smallresources


# -----------------------------------------------------------------------------
# ADMIN / DEVELOPMENT TOOLING
# -----------------------------------------------------------------------------

ensure szcore_admin

# Benchmark has no meaningful idle workload, but it is primarily a
# development/staging tool. Comment this line on production if you do not
# want benchmark commands/resources available.
ensure szcore_benchmark


# -----------------------------------------------------------------------------
# OPTIONAL COMPATIBILITY ADAPTERS
# -----------------------------------------------------------------------------
#
# The recipe downloads these adapters, but they are intentionally NOT started
# by default. Only enable the adapter required by legacy resources.
#
# IMPORTANT: do not run multiple framework compatibility identities unless
# you explicitly know why you need them.
#
# ensure es_extended    # SzCore ESX adapter
# ensure qb-core        # SzCore QB-Core adapter
# ensure qbx_core       # SzCore Qbox adapter


# -----------------------------------------------------------------------------
# ACE PERMISSIONS
# -----------------------------------------------------------------------------

# txAdmin inserts the deployer's master identifier here.
{{addPrincipalsMaster}}

# Standard admin group.
add_ace group.admin command allow
add_ace group.admin command.quit deny

# Full SzCore administrator permission.
# SzCore's permission API treats this as framework-admin access.
add_ace group.admin szcore.admin allow

# Queue reserved-slot / priority access.
add_ace group.admin szcore.priority allow

# Explicit benchmark permission (admins are also recognized by SzCore).
add_ace group.admin szcore.benchmark allow

# Optional manual admin:
# add_principal identifier.fivem:YOUR_CFX_ID group.admin
#
# Other supported identifiers may also be used, for example:
# add_principal identifier.license:YOUR_LICENSE group.admin


# -----------------------------------------------------------------------------
# OPTIONAL MONITORING
# -----------------------------------------------------------------------------
#
# FXServer can expose /perf Prometheus metrics with Basic Auth.
# Leave these unset unless you intentionally expose and secure that endpoint.
#
# set sv_prometheusBasicAuthUser "metrics"
# set sv_prometheusBasicAuthPassword "CHANGE_ME"


# -----------------------------------------------------------------------------
# END OF SZCORE SERVER CONFIG
# -----------------------------------------------------------------------------
