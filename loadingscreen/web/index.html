<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SzCore Framework</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <main class="shell">
    <section class="brand">
      <div class="logo-wrap">
        <div class="logo-ring ring-1"></div>
        <div class="logo-ring ring-2"></div>
        <div class="logo">
          <strong>SZ</strong>
          <span>CORE</span>
        </div>
      </div>

      <div class="copy">
        <div class="eyebrow"><span class="dot"></span> SZCODE PRESENTS</div>
        <h1>SzCore <span>Framework</span></h1>
        <p>Modular. Server-authoritative. Built for modern FiveM roleplay.</p>
      </div>
    </section>

    <section class="status-card">
      <div class="status-head">
        <div>
          <span class="status-label">LOADING</span>
          <strong id="status">Initializing SzCore...</strong>
        </div>
        <div id="percent" class="percent">0%</div>
      </div>

      <div class="progress-track">
        <div id="progress" class="progress"></div>
        <div class="glow"></div>
      </div>

      <div class="meta">
        <span id="stage">Connecting to server</span>
        <span>v1.4.0-rc1</span>
      </div>
    </section>

    <section class="footer">
      <div class="tip">
        <span>TIP</span>
        <p id="tip">Your character and persistent data are handled by the SzCore server authority.</p>
      </div>
      <div class="modules">
        <span>CORE</span><i></i><span>CHARACTER</span><i></i><span>ECONOMY</span><i></i><span>VEHICLES</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
